{{define "app.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · MangaHub</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/manga.js" defer></script>
</head>
<body class="workspace-page">
  <aside class="sidebar">
    <a class="brand sidebar-brand" href="/app">
      <span class="brand-mark" aria-hidden="true">MH</span>
      <span><strong>MangaHub</strong><small id="workspace-label">Reading workspace</small></span>
    </a>
    <p class="nav-label" id="nav-label">Learning workspace</p>
    <nav id="app-nav" aria-label="Primary navigation"></nav>
    <div class="sidebar-user">
      <span class="avatar" id="user-avatar" aria-hidden="true">–</span>
      <span><strong id="sidebar-username">Loading…</strong><small id="sidebar-role">Verifying session</small></span>
    </div>
  </aside>

  <main class="workspace-main">
    <header class="topbar">
      <div><span class="status-dot" aria-hidden="true"></span><span id="session-status">Checking session</span></div>
      <div class="topbar-actions">
        <a id="notification-link" class="notification-link" href="#notifications" hidden>Notifications <span id="notification-count" hidden>0</span></a>
        <button id="logout-button" class="secondary-button" type="button">Sign out</button>
      </div>
    </header>

    <section class="app-content" aria-live="polite">
      <div id="app-alert" class="form-alert" role="alert" hidden></div>
      <div id="app-view"><div class="loading-state">Loading workspace…</div></div>
    </section>
  </main>
</body>
</html>
{{end}}
